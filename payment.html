<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagar Reserva - ChivAPP</title>
    <link rel="stylesheet" href="build/css/app.css" />
  </head>
  <body>
    <header class="header">
      <div class="contenedor contenido-header">
        <h1><a href="index.html">ChivApp</a></h1>
        <nav class="navegacion-principal">
          <a href="index.html">Cerrar sesión</a>
        </nav>
      </div>
    </header>

    <section id="payment-options">
      <div class="contenido-card">
        <h2>Elige una opción de pago</h2>
        <button id="pay-with-card-btn">Pagar con Tarjeta</button>
        <button id="pay-with-qr-btn">Pagar con QR</button>
      </div>
    </section>

    <section id="card-payment-section" style="display: none">
      <div class="contenido-card">
        <h2>Pagar con Tarjeta</h2>
        <form
          action="confirmacion.html"
          class="formulario-viaje"
          id="card-payment-form"
        >
          <div class="form-group">
            <label for="card-number">Número de Tarjeta:</label>
            <input type="text" id="card-number" name="card-number" required />
          </div>
          <div class="form-group">
            <label for="card-expiry">Fecha de Expiración:</label>
            <input
              type="text"
              id="card-expiry"
              name="card-expiry"
              placeholder="MM/AA"
              required
            />
          </div>
          <div class="form-group">
            <label for="card-cvc">CVC:</label>
            <input type="text" id="card-cvc" name="card-cvc" required />
          </div>
          <input type="hidden" id="total-amount" name="total-amount" />
          <button type="submit">Pagar</button>
          <button type="button" id="back-to-payment-options">
            Volver a Opciones de Pago
          </button>
        </form>
      </div>
    </section>

    <section id="qr-payment-section" style="display: none">
      <div class="contenido-card">
        <h2>Pagar con QR</h2>
        <div class="qr-section">
          <img src="src/img/qr.jpg" alt="Código QR" />
        </div>

        <form
          action="confirmacion.html"
          class="formulario-viaje"
          id="qr-payment-form"
        >
          <div class="form-group">
            <label for="transfer-capture"
              >Subir Captura de Transferencia:</label
            >
            <input type="file" id="transfer-capture" name="transfer-capture" />
          </div>

          <button type="submit">Enviar</button>
          <button type="button" id="back-to-payment-options-qr">
            Volver a Opciones de Pago
          </button>
        </form>
      </div>
    </section>

    <footer class="contenedor-footer">
      <p>Todos los derechos reservados ChivApp 2024 &copy;</p>
    </footer>

    <script src="build/js/payment.js"></script>
  </body>
</html>
