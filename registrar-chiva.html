<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChivApp - Viaja por Antioquia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="build/css/app.css">
</head>

<body>
    <header class="header">
        <div class="contenedor contenido-header">
            <h1><a href="index.html">ChivApp</a></h1>
            <nav class="navegacion-principal">
                <a href="index.html">Cerrar sesión</a>
            </nav>
        </div>
    </header>
    <div class="admin1">
    </div>
    <section class="registro-chiva">
        <div class="contenido-registro">
            <h2>Registrar una Chiva</h2>
            <form action="" class="formulario-registro">
                <input class="formulario__campo" type="text" name="marca" id="marcaInput" placeholder="Marca">
                <input class="formulario__campo" type="text" name="placa" id="placaInput" placeholder="Placa">
                <input class="formulario__campo" type="number" name="capacidad" id="capacidadInput" placeholder="Capacidad">
                <input class="formulario__campo" type="number" name="modelo" id="modeloInput" placeholder="Modelo(año)">
                <div class="botones-centrados">
                    <input class="formulario__submitAdmin" type="submit" value="Registrar">
                    <a href="admin1.html" class="formulario__volver">Volver</a>
                </div>
            </form>
        </div>
    </section>
</body>

<footer class="contenedor-footer">
    <p>Todos los derechos reservados ChivApp 2024 &copy;</p>
</footer>
</html>
