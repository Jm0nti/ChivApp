<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChivApp</title>
    <link rel="icon" type="image/png" href="/src/img/chiva.png">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="build/css/app.css" />
  </head>
  <body>
    <div class="contenido-confirmacion">
      <h2 id="confirmacion-titulo">Confirmación de Pago</h2>
      <div id="confirmacion-mensaje" class="confirmacion-exito">
        <!-- Aquí se mostrará "Pago Confirmado" o "Pago Rechazado" según el resultado -->
      </div>
      <div id="detalles-pago" class="detalles-pago">
        <!-- Aquí se mostrarán los detalles del pago si fue confirmado -->
      </div>
      <p id="info-adicional">
        <!-- Información adicional para pagos por QR -->
      </p>

      <!-- Formulario para el envío de datos por POST -->
      <form id="confirmation-form" action="home.html">
        <button type="submit">Finalizar</button>
      </form>
    </div>

    <script src="build/js/confirmacion.js"></script>
  </body>
</html>
