<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmación de Pago - ChivAPP</title>
    <link rel="stylesheet" href="build/css/app.css" />
  </head>
  <body>
    <div class="contenido-confirmacion">
      <h2 id="confirmacion-titulo">Confirmación de Pago</h2>
      <div id="confirmacion-mensaje" class="confirmacion-exito">
        <!-- Aquí se mostrará "Pago Confirmado" o "Pago Rechazado" según el resultado -->
      </div>
      <div id="detalles-pago" class="detalles-pago">
        <!-- Aquí se mostrarán los detalles del pago si fue confirmado -->
      </div>
      <p id="info-adicional">
        <!-- Información adicional para pagos por QR -->
      </p>
    </div>

    <script src="build/js/confirmacion.js"></script>
  </body>
</html>
